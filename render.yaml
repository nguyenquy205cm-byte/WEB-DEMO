services:
  - type: web
    name: sneaker-store-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sneaker-store-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sneaker-store-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        sync: false

databases:
  - name: sneaker-store-db
    plan: free
    postgresMajorVersion: "16"
